name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce Change Safety
        run: node scripts/check-change-safety.cjs
        env:
          CHANGE_SAFETY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Verify Tracked Files
        shell: bash
        run: |
          test -n "$(git ls-files)"

          while IFS= read -r file; do
            [ -s "$file" ] || {
              echo "Empty tracked file: $file"
              exit 1
            }
          done < <(
            git ls-files \
              '*.html' \
              '*.css' \
              '*.js' \
              '*.json' \
              '*.md' \
              '*.yml' \
              '*.yaml'
          )
